name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            g++ \
            libasound2t64 \
            libudev1 \
            libv4l-0 \
            ffmpeg \
            rsync

      - name: Install uv
        run: pipx install uv

      - name: Set up Python
        run: uv python install 3.13

      - name: Build native library
        run: packages/magewell/build_lib.sh

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -m "not device" -v
