# uv workspace root (virtual — not itself a package).
# Members are the individual packages installed into the shared .venv.
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.3.0",
    "websockets>=16",
]

[tool.pytest.ini_options]
testpaths = ["packages/magewell/tests", "tests"]
asyncio_mode = "auto"
markers = [
    "virtual_device: requires v4l2loopback + snd-aloop kernel modules (Tier 2)",
    "device: requires Magewell capture hardware (Tier 3)",
]
